name: ci
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      CONTROLFLOW_AUDIT_TRUST_DIR: ${{ github.workspace }}/state/audit_trust
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --extra dev
      - run: uv run ruff format --check src tests scripts
      - run: uv run ruff check src tests scripts
      - run: uv run mypy src
      - run: uv run pytest -q -m "not gpu and not spark and not network and not sealed"
