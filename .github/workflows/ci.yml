name: ci
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      CONTROLFLOW_AUDIT_TRUST_DIR: ${{ github.workspace }}/state/audit_trust
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - run: uv sync --locked --extra dev
      - name: Report CI tool versions
        run: |
          uv run --no-sync python --version
          uv run --no-sync python -c "import numpy; print('NumPy', numpy.__version__)"
          uv run --no-sync mypy --version
      - run: uv run ruff format --check src tests
      - run: uv run ruff check src tests
      - run: uv run mypy src
      - run: uv run pytest -q -m "not gpu and not spark and not network and not sealed"
